name: Build Prayer Time

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prayer-time-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project PrayerTime.xcodeproj -scheme PrayerTime
      - name: Build for iPhone and iPad
        run: >-
          xcodebuild -project PrayerTime.xcodeproj -scheme PrayerTime
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/device
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/PrayerTime.app build/package/Payload/
          cd build/package
          ditto -c -k --keepParent Payload PrayerTime-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTime-unsigned-IPA
          path: build/package/PrayerTime-unsigned.ipa
          if-no-files-found: error

