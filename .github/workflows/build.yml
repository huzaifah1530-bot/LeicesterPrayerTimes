name: Build Prayer Time

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prayer-time-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Timetable parser and UK time tests
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test the real HTML fixtures
        run: swift test --parallel

  ios:
    name: iOS 27 simulator and unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project PrayerTime.xcodeproj -scheme PrayerTime
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -project PrayerTime.xcodeproj -scheme PrayerTime
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator
          CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone and iPad
        run: >-
          xcodebuild -project PrayerTime.xcodeproj -scheme PrayerTime
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/device
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA and simulator app
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/PrayerTime.app build/package/Payload/
          cd build/package
          ditto -c -k --keepParent Payload PrayerTime-unsigned.ipa
          cd ../..
          ditto -c -k --keepParent build/simulator/Build/Products/Debug-iphonesimulator/PrayerTime.app build/PrayerTime-simulator.zip
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTime-unsigned-IPA
          path: build/package/PrayerTime-unsigned.ipa
          if-no-files-found: error
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTime-simulator
          path: build/PrayerTime-simulator.zip
          if-no-files-found: error
      - name: Choose an iOS 27 iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime,group in data["devices"].items() if "iOS-27" in runtime for d in group if "iPhone" in d["name"]]; print(devices[0]["udid"])')
          echo "PRAYER_TIME_SIMULATOR=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Test navigation and capture native screenshots
        run: >-
          xcodebuild test -project PrayerTime.xcodeproj -scheme PrayerTime
          -configuration Debug
          -destination "platform=iOS Simulator,id=$PRAYER_TIME_SIMULATOR"
          -derivedDataPath build/simulator -resultBundlePath build/UI.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/UI.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UI.xcresult --output-path build/screenshots
          fi
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTime-native-screenshots
          path: |
            build/screenshots/
            build/UI.xcresult/
          if-no-files-found: ignore

