name: PrayerTime
options:
  bundleIdPrefix: uk.prayertime
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PrayerTimeCore:
    path: .
targets:
  PrayerTime:
    type: application
    platform: iOS
    sources:
      - path: PrayerTime
        excludes: [Info.plist]
    dependencies:
      - package: PrayerTimeCore
      - target: PrayerTimeWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.prayertime.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PrayerTime/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prayer Time
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-indigo AppIcon-purple AppIcon-pink AppIcon-red AppIcon-orange AppIcon-yellow AppIcon-green AppIcon-teal"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PrayerTime/PrayerTime.entitlements
    scheme:
      testTargets: []
  PrayerTimeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayerTimeWidgets
        excludes: [Info.plist]
    dependencies:
      - package: PrayerTimeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.prayertime.app.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PrayerTimeWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prayer Time
        CODE_SIGN_ENTITLEMENTS: PrayerTime/PrayerTime.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

